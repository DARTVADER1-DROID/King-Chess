name: CI

on:
  push:
    branches: ["main", "refactor/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Use the matching Playwright image: Chromium and its Linux libraries are preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Set up Python test runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python browser-test dependencies
        run: pip install -r requirements-test.txt
      - name: Verify preinstalled Playwright browser
        run: python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(headless=True); b.close(); p.stop()"
      - name: Run Python unit and browser functional tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
